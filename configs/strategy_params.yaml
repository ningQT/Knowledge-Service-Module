# KSM Search Strategy Parameters
# Reference: 知识服务模块检索流程完整设计_v2 Section 8.5

strategies:
  concept:
    map_priority: false
    anchor_limit: 1
    max_depth: 1
    primary_group: core_hits
    result_limits:
      core_hits: 3
      related_cards: 5
      source_notes: 3
      maps: 1

  topic_scan:
    map_priority: true
    anchor_limit: 1
    max_depth: 2
    primary_group: maps
    result_limits:
      core_hits: 1
      related_cards: 15
      source_notes: 5
      maps: 3

  compare:
    map_priority: true
    anchor_limit: 5
    max_depth: 2
    primary_group: core_hits
    result_limits:
      core_hits: 5
      related_cards: 10
      source_notes: 5
      maps: 2

  relation:
    map_priority: true
    anchor_limit: 2
    max_depth: 2
    primary_group: related_cards
    result_limits:
      core_hits: 2
      related_cards: 10
      source_notes: 3
      maps: 1

  source_trace:
    map_priority: false
    anchor_limit: 1
    max_depth: 1
    primary_group: source_notes
    result_limits:
      core_hits: 1
      related_cards: 3
      source_notes: 5
      maps: 0

  fallback:
    map_priority: false
    anchor_limit: 5
    max_depth: 1
    primary_group: core_hits
    result_limits:
      core_hits: 5
      related_cards: 5
      source_notes: 3
      maps: 1
