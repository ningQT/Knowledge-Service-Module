services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KSM_ENV: prod
      KSM_HOST: 0.0.0.0
      KSM_PORT: 8900
      KSM_DATA_DIR: /app/data/vaults
      KSM_DB_BACKUP_DIR: /app/data/backups
      KSM_ENABLE_DOCS: "false"
      KSM_CORS_ORIGINS: http://localhost:8080
      KSM_CSRF_TRUSTED_ORIGINS: http://localhost:8080
      KSM_SECURE_COOKIES: "true"
      KSM_TRUST_PROXY_HEADERS: "true"
      KSM_REQUIRE_HTTPS_LLM_BASE_URL: "true"
    volumes:
      - ksm-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ksm-data:
